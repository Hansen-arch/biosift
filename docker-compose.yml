version: "3.9"

services:
  biosift:
    build: .
    container_name: biosift-standalone
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c 'import urllib.request as u;
          u.urlopen("http://localhost:8080/api/health", timeout=10)'
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
